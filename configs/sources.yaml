# Data source endpoints and scraping policy.
#
# Verified 2026-06-13 (Task 0). Key facts discovered:
#   - The SOC "complete schedule" is a nightly single-file HTML dump per cycle.
#   - CMU REMOVED instructor and Bldg/Room columns starting with Fall 2025.
#     Semesters <= S25 (via Wayback Machine snapshots) have both; F25/S26 don't.
#   - Instructor strings are comma-joined LAST NAMES ("Taylor, Kosbie" = 2 people).
#   - Course descriptions come from the official course catalog (see
#     course_catalog below) — semester-independent, ~37 pages for the whole
#     university. The SOC courseDetails endpoint also has descriptions but is
#     per-course and only works for live semesters, so the catalog is primary.
soc:
  verified: true
  complete_schedule:
    spring: "https://enr-apps.as.cmu.edu/assets/SOC/sched_layout_spring.htm"
    fall: "https://enr-apps.as.cmu.edu/assets/SOC/sched_layout_fall.htm"
  # description source, live semesters only: ?COURSE=15112&SEMESTER=S26
  course_details: "https://enr-apps.as.cmu.edu/open/SOC/SOCServlet/courseDetails"
  # Per-semester source map. "live" = current nightly dump; otherwise a
  # Wayback Machine timestamp of the same asset URL (id_ suffix = raw page).
  semester_sources:
    S26: { kind: live, cycle: spring } # no instructors/rooms
    F25: { kind: wayback, cycle: fall, timestamp: "20250909001330" } # no instructors/rooms
    S25: { kind: wayback, cycle: spring, timestamp: "20250425163527" } # full columns
    F24: { kind: wayback, cycle: fall, timestamp: "20240727062615" } # full columns
    # NB: the 20231205 snapshot is truncated (~half the depts); 20240610 is complete
    S24: { kind: wayback, cycle: spring, timestamp: "20240610132604" } # full columns
    F23: { kind: wayback, cycle: fall, timestamp: "20230903144728" } # full columns

course_catalog:
  # Canonical, semester-independent descriptions. Each department's /courses/
  # page lists every course as a "courseblock": <dt>code title</dt><dd>units +
  # description</dd>. ~37 pages cover the university (college-level pages
  # aggregate sub-departments; dedupe by course_id).
  #
  # Regenerate course_pages by crawling /courses/ links from the catalog home
  # ( / ) and /schools-colleges/ index.

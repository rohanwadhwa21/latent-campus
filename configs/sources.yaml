directory:
  # CMU people directory — the resolution source for Week 4 faculty ER.
  # Verified 2026-07-06 (Task 0). Key facts:
  #   - Anonymous search is NAME-ONLY (search-by-department requires Shibboleth
  #     login), via POST to /index.cgi. Basic form fields:
  #       search=<name>&action=Search&searchtype=basic&activetab=basic
  #   - Result shapes: 0 hits -> bare form page; 1 hit -> person detail page
  #     directly (h1 id="listing"); >1 hits -> table id="sortabletable" with
  #     Last | First | AndrewID | Affiliation | Department columns and a
  #     per-person guid detail link (index.cgi?searchtype=guid&guid=...).
  #   - HARD CAP: "You have reached the search limit of 200 results" — very
  #     common surnames (Lee/Li/Wu/Zhang) are truncated; capped surnames are
  #     flagged and routed to the manual-review queue.
  #   - Advanced-search fields are whole-word matches (first_name=a matches
  #     nothing), so a first-letter split can NOT beat the cap.
  #   - Acceptable use (posted on every page): no mailing/solicitation use.
  #     We store ONLY name, andrew_id, affiliation, HR job title, department,
  #     and campus room — never email or phone.
  base_url: "https://directory.andrew.cmu.edu"
  search_endpoint: "/index.cgi"

cmucourses:
  # ScottyLabs course-tool API — CROSS-VALIDATION ONLY (locked Week-1 decision:
  # never a primary source). Used in Week 4 to verify faculty resolution:
  # its schedules carry instructor FULL names ("Last, First") per semester,
  # independent of our directory pipeline. Verified 2026-07-07:
  #   GET /courses?courseID=15-112&courseID=...&schedules=true (batchable)
  base_url: "https://course.apis.scottylabs.org"

wayback_prefix: "http://web.archive.org/web"

scraping:
  user_agent: "latent-campus-research (rohanw2105@gmail.com)"
  min_seconds_between_requests: 2.0
  jitter_seconds: 0.5
  timeout_seconds: 120 # web.archive.org can be slow on big assets
  max_retries: 3

campus_filter: "Pittsburgh, Pennsylvania" # exclude Qatar / remote sections

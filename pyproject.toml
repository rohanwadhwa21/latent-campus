[project]
name = "latent-campus"
version = "0.1.0"
description = "A multimodal institutional atlas of CMU: courses, faculty, departments, and buildings in one latent space."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.7",
    "polars>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "sentence-transformers>=3.0",
    "umap-learn>=0.5.12",
    "matplotlib>=3.11.0",
    "plotly>=6.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latent_campus"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
